<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cap studio: 3D hat mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Playfair+Display:wght@700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{
  --backdrop:#E3E4E6; --backdrop-hi:#F3F3F4; --panel:#F7F7F5; --ink:#202428; --muted:#5F656C;
  --rule:#D4D6D9; --field:#FFFFFF; --accent:#1E6B4A; --accent-ink:#FFFFFF; --chip:#ECEDEB;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --backdrop:#2B2E32; --backdrop-hi:#3A3E43; --panel:#1D1F22; --ink:#ECEDEE; --muted:#A3A8AE;
    --rule:#373B40; --field:#25282C; --accent:#57B98F; --accent-ink:#0E1A14; --chip:#2A2D31; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --backdrop:#2B2E32; --backdrop-hi:#3A3E43; --panel:#1D1F22; --ink:#ECEDEE; --muted:#A3A8AE;
  --rule:#373B40; --field:#25282C; --accent:#57B98F; --accent-ink:#0E1A14; --chip:#2A2D31; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--panel);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:minmax(0,1fr) 372px;height:100%}
.stage{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 38%,var(--backdrop-hi) 0%,var(--backdrop) 62%)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
.stage canvas:active{cursor:grabbing}
.stage canvas:focus-visible{box-shadow:inset 0 0 0 3px var(--accent)}
.brand{position:absolute;left:24px;top:20px;pointer-events:none}
.brand h1{margin:0;font-size:30px;line-height:1;font-weight:850;font-stretch:72%;letter-spacing:-.01em}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13px}
.views{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:2px;padding:3px;
  background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--rule);border-radius:999px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:calc(100% - 24px);overflow-x:auto}
.views button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:550;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tools{position:absolute;right:16px;top:16px;display:flex;gap:8px;align-items:center}
.drophint{position:absolute;inset:14px;border:2px dashed var(--accent);border-radius:18px;display:none;align-items:center;justify-content:center;
  font-weight:700;font-size:18px;color:var(--accent);background:color-mix(in srgb,var(--panel) 55%,transparent);pointer-events:none}
.stage.dragging .drophint{display:flex}
.btn{appearance:none;border:1px solid var(--rule);background:var(--field);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;
  padding:8px 13px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{background:transparent}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:9px;font-size:13.5px;
  opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

.rail{border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--panel);z-index:2}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:600;padding:15px 11px 13px;cursor:pointer;border-bottom:3px solid transparent;flex:1 0 auto;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panels{overflow-y:auto;flex:1;min-height:0}
.panel{padding:20px 22px 28px;display:none}
.panel.active{display:block}
.panel h2{margin:0 0 4px;font-size:21px;font-weight:800;font-stretch:80%;letter-spacing:-.005em}
.fitnote{font-size:12.5px;color:var(--muted);margin:8px 0 0;max-width:36ch}
.panel .lede{margin:0 0 18px;color:var(--muted);font-size:13.5px;max-width:34ch}
.group{padding:16px 0;border-top:1px solid var(--rule)}
.group:first-of-type{border-top:0;padding-top:4px}
.group > .label{display:block;font-size:13px;font-weight:650;margin-bottom:9px}
.upload{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.upload small{color:var(--muted);font-size:12.5px;flex-basis:100%}
.textrow{display:grid;grid-template-columns:1fr auto 40px;gap:8px}
input[type="text"],select{font:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:9px;padding:8px 10px;min-width:0}
input[type="color"]{width:40px;height:38px;border:1px solid var(--rule);border-radius:9px;background:var(--field);padding:3px;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:var(--field)}
.seg button{border:0;background:none;color:var(--ink);font:inherit;font-size:13.5px;font-weight:550;padding:7px 12px;cursor:pointer}
.seg button + button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.slider{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;margin:10px 0 4px}
.slider label{font-size:13.5px}
.slider output{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.slider input{grid-column:1 / -1;width:100%;accent-color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.swatches{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swatch{display:flex;align-items:center;gap:10px;border:1px solid var(--rule);background:var(--field);border-radius:10px;padding:8px 10px;cursor:pointer;font:inherit;color:var(--ink);text-align:left;font-size:13.5px;font-weight:550}
.swatch .chips{display:flex}
.swatch .chips i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.18);margin-left:-5px}
.swatch .chips i:first-child{margin-left:0}
.colorgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.colorgrid label{display:flex;align-items:center;gap:10px;font-size:13.5px}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px;margin-top:12px}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.status{font-size:12.5px;color:var(--muted);margin-top:8px}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:56vh auto;height:auto;min-height:100%}
  html,body{height:auto}
  .stage{height:56vh}
  .rail{border-left:0;border-top:1px solid var(--rule)}
  .panels{overflow:visible}
  .brand h1{font-size:24px}
  .brand p{display:none}
  .tools .btn span.lbl{display:none}
}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="app">
  <main class="stage" id="stage">
    <canvas id="gl" tabindex="0" aria-label="3D hat preview. Drag or use arrow keys to rotate; scroll, pinch, or plus and minus to zoom."></canvas>
    <div class="brand"><h1>Cap studio</h1><p>Drag to rotate, scroll or pinch to zoom</p></div>
    <div class="tools">
      <button class="btn quiet" id="spinBtn" aria-pressed="false" title="Spin the hat">↻ <span class="lbl">Spin</span></button>
      <button class="btn primary" id="saveBtn">Save PNG</button>
    </div>
    <nav class="views" aria-label="Camera views">
      <button data-view="front">Front</button>
      <button data-view="quarter" aria-pressed="true">Three-quarter</button>
      <button data-view="left">Side</button>
      <button data-view="back">Back</button>
      <button data-view="under">Under</button>
      <button data-view="inside">Inside</button>
    </nav>
    <div class="drophint">Drop to place on the <span id="dropZoneName">front</span></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <aside class="rail">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="front" aria-selected="true">Front</button>
      <button role="tab" data-tab="side" aria-selected="false">Side</button>
      <button role="tab" data-tab="back" aria-selected="false">Back</button>
      <button role="tab" data-tab="under" aria-selected="false">Underbrim</button>
      <button role="tab" data-tab="inside" aria-selected="false">Inside</button>
      <button role="tab" data-tab="colors" aria-selected="false">Colors</button>
    </div>
    <div class="panels" id="panels">
      <section class="panel" data-panel="colors">
        <h2>Colorway</h2>
        <p class="lede">Start from a preset, then fine-tune each part of the cap.</p>
        <div class="group">
          <span class="label">Presets</span>
          <div class="swatches" id="presets"></div>
        </div>
        <div class="group">
          <span class="label">Parts</span>
          <div class="colorgrid">
            <label><input type="color" data-color="crown"> Crown</label>
            <label><input type="color" data-color="brim"> Brim top</label>
            <label><input type="color" data-color="under"> Underbrim</label>
            <label><input type="color" data-color="button"> Top button</label>
            <label><input type="color" data-color="rope"> Rope</label>
          </div>
          <label class="check"><input type="checkbox" id="ropeToggle" checked> Rope above the brim</label>
          <label class="check"><input type="checkbox" id="perfToggle" checked> Laser-perforated side and back panels</label>
        </div>
        <div class="group">
          <span class="label">Export</span>
          <label class="check" style="margin-top:0"><input type="checkbox" id="transparentToggle"> Transparent background on saved PNG</label>
        </div>
      </section>
    </div>
  </aside>
</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const TAU=Math.PI*2;

/* ---------- color helpers ---------- */
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function shade(hex,amt){const[r,g,b]=hexToRgb(hex);const t=amt<0?0:255,p=Math.abs(amt);return rgbToHex(r+(t-r)*p,g+(t-g)*p,b+(t-b)*p);}
function lum(hex){const[r,g,b]=hexToRgb(hex);return(0.2126*r+0.7152*g+0.0722*b)/255;}
const isDark=h=>lum(h)<0.42;
function lin(hex){return new THREE.Color(hex).convertSRGBToLinear();}

/* ---------- state ---------- */
const colors={crown:'#F3F3F1',brim:'#1F2225',under:'#1F2225',button:'#1F2225',strap:'#1F2225',rope:'#F4F4F2',
  binding:null,lining:null,tape:null,sweat:null}; // null = follows the crown color
function eff(k){if(colors[k])return colors[k];const c=colors.crown,d=isDark(c);
  if(k==='binding')return shade(c,d?0.07:-0.07);if(k==='tape')return shade(c,d?0.08:-0.04);return c;}
const PRESETS=[
  {name:'White and black',c:{crown:'#F3F3F1',brim:'#1F2225',under:'#1F2225',button:'#1F2225',strap:'#1F2225'}},
  {name:'Blackout',c:{crown:'#2A2D30',brim:'#2A2D30',under:'#2A2D30',button:'#2A2D30',strap:'#1C1E20'}},
  {name:'Navy and white',c:{crown:'#22324F',brim:'#F1F1EE',under:'#22324F',button:'#F1F1EE',strap:'#1C1E20'}},
  {name:'Stone and pine',c:{crown:'#D8D0BF',brim:'#2E5C45',under:'#2E5C45',button:'#2E5C45',strap:'#3A3A35'}},
  {name:'Heather grey',c:{crown:'#A9ADB1',brim:'#A9ADB1',under:'#3B4046',button:'#3B4046',strap:'#2A2D30'}},
  {name:'Sky and white',c:{crown:'#9FC3E2',brim:'#F4F4F2',under:'#F4F4F2',button:'#F4F4F2',strap:'#F4F4F2'}}
];
let perforated=true;

const ZONES={
  front:{title:'Front art',lede:'The main logo, centered on the front panel.',
    size:6.5,h:0,v:4.6,rot:0,backing:'none',backingColor:'#F4F4F2',source:'sample',image:null,text:'',font:'sans',textColor:'#1F2225',
    ranges:{size:[2,11],h:[-6,6],v:[1,9]},labels:{h:'Left to right',v:'Up and down'},view:'front'},
  side:{title:'Side art',lede:'A small patch or mark on the side panel.',
    size:3.2,h:-0.15,v:2.1,rot:0,backing:'patch',backingColor:'#F4F4F2',source:'sample',image:null,text:'',font:'script',textColor:'#1F2225',which:'left',
    ranges:{size:[1.5,8],h:[-6,8],v:[0.6,8]},labels:{h:'Front to back',v:'Up and down'},view:'left'},
  back:{title:'Back',lede:'Art on the back panels above the snap closure, plus the closure colors.',
    size:4,h:0,v:6.6,rot:0,backing:'none',backingColor:'#F4F4F2',source:'sample',image:null,text:'',font:'sans',textColor:'#1F2225',
    ranges:{size:[1.5,12],h:[-6,6],v:[1,8.8]},labels:{h:'Left to right',v:'Up and down'},view:'back'},
  inside:{title:'Inside',lede:'Colors for the lining, seam tape and sweatband, and a print that fills the inside of the two front panels, above the brim.',
    size:20,h:0,v:7,rot:0,backing:'none',backingColor:'#F4F4F2',source:'sample',image:null,text:'',font:'serif',textColor:'#1F2225',which:'front',fit:'fill',autoFit:true,
    ranges:{size:[1.5,40],h:[-10,10],v:[0,16]},labels:{h:'Left to right',v:'Up from the brim'},view:'insideFront'},
  under:{title:'Underbrim art',lede:'A print on the underside of the bill, oriented so the wearer reads it. Uploads are lined up to the brim automatically.',
    size:20,h:0,v:0,rot:0,backing:'none',backingColor:'#F4F4F2',source:'sample',image:null,text:'',font:'sans',textColor:'#F4F4F2',
    fit:'fill',autoFit:true,note:'',
    ranges:{size:[3,40],h:[-9,9],v:[-6,6]},labels:{h:'Left to right',v:'Toward the front edge'},view:'under'}
};
let activeTab='front';

/* ---------- renderer / scene ---------- */
const canvas=$('#gl'), stage=$('#stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
renderer.shadowMap.enabled=false; // no ground shadow
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000,0);
const maxAniso=renderer.capabilities.getMaxAnisotropy();

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,1,0.5,400);
scene.add(new THREE.HemisphereLight(0xffffff,0x9aa0a8,0.78));
const key=new THREE.DirectionalLight(0xffffff,0.82);
key.position.set(10,22,14);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:80});
key.shadow.bias=-0.0006;key.shadow.normalBias=0.03;
scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,0.32);fill.position.set(-12,6,-8);scene.add(fill);
const rim=new THREE.DirectionalLight(0xffffff,0.22);rim.position.set(0,-10,6);scene.add(rim);

/* ---------- crown geometry ---------- */
const A=8.1,B=10.0,H=9.5;
// Seam angles (front = 0). Front panel spans +/-1.18 rad, then four equal panels.
const SEAM_TH=[1.18,2.16,Math.PI];
let CENTER_A=2; // where the partial front seam stops (a-param); set below
function panelShape(th,a){
  th=Math.atan2(Math.sin(th),Math.cos(th)); // wrap to (-180°, 180°] so both back panels match
  const at=Math.abs(th);let dmin=1e9;for(const sv of SEAM_TH)dmin=Math.min(dmin,Math.abs(at-sv));
  let lo,hi,amp;
  if(at<SEAM_TH[0]){lo=-SEAM_TH[0];hi=SEAM_TH[0];amp=0.06;at;}
  else if(at<SEAM_TH[1]){lo=SEAM_TH[0];hi=SEAM_TH[1];amp=0.16;}
  else{lo=SEAM_TH[1];hi=SEAM_TH[2];amp=0.16;}
  const x=at<SEAM_TH[0]?th:at,frac=(x-lo)/(hi-lo);
  let g=amp*Math.sin(Math.PI*frac)-0.14*Math.exp(-(dmin/0.02)*(dmin/0.02));
  // A-frame peak: the upper front is pinched into a ridge along the partial center seam
  if(a!==undefined&&a>0.35){const k=Math.min(1,(a-0.35)/0.4),ks=k*k*(3-2*k);g+=0.25*ks*Math.max(0,1-Math.abs(th)/0.55);}
  if(a!==undefined&&a>CENTER_A-0.015){const k=Math.min(1,(a-(CENTER_A-0.015))/0.03);g-=0.13*k*k*(3-2*k)*Math.exp(-(th/0.02)*(th/0.02));}
  return g;
}
/* Crown shape, matched to the reference photos: every meridian runs from the base edge up to the button.
   The front meridian is the A-frame profile (a straight front panel leaning back, a rounded corner,
   then a straight slope up to the button set back near mid-crown); sides and back are rounded arches. */
const ZA=0.75; // button position, front-to-back (base runs from z=+10 to z=-10)
const PN=400;
function resampleProfile(pts){
  const d=[0];for(let i=1;i<pts.length;i++)d.push(d[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const out=[],tot=d[d.length-1];let j=0;
  for(let k=0;k<=PN;k++){const u=k/PN*tot;while(j<d.length-2&&d[j+1]<u)j++;const f=(u-d[j])/Math.max(1e-9,d[j+1]-d[j]);
    out.push([pts[j][0]+(pts[j+1][0]-pts[j][0])*f,pts[j][1]+(pts[j+1][1]-pts[j][1])*f]);}
  return out;
}
function archProfile(n){const p=[];for(let i=0;i<=800;i++){const al=i/800*Math.PI/2;p.push([Math.pow(Math.cos(al),2/n),Math.pow(Math.sin(al),2/n)]);}return resampleProfile(p);}
function aFrameProfile(){
  const P0=[1,0],C=[0.74,0.77],P3=[0,1],r=0.17,p=[];
  const n1=Math.hypot(C[0]-P0[0],C[1]-P0[1]),n2=Math.hypot(P3[0]-C[0],P3[1]-C[1]);
  const a=[C[0]-(C[0]-P0[0])/n1*r,C[1]-(C[1]-P0[1])/n1*r],b=[C[0]+(P3[0]-C[0])/n2*r,C[1]+(P3[1]-C[1])/n2*r];
  for(let i=0;i<=200;i++){const t=i/200;p.push([P0[0]+(a[0]-P0[0])*t,P0[1]+(a[1]-P0[1])*t]);}
  for(let i=1;i<=100;i++){const t=i/100,u=1-t;p.push([u*u*a[0]+2*u*t*C[0]+t*t*b[0],u*u*a[1]+2*u*t*C[1]+t*t*b[1]]);}
  for(let i=1;i<=200;i++){const t=i/200;p.push([b[0]+(P3[0]-b[0])*t,b[1]+(P3[1]-b[1])*t]);}
  return resampleProfile(p);
}
// Front and back meridians traced from the reference side-view photo (leveled to the crown base);
// values are [fraction of the way out from the button, fraction of crown height].
const REF_FRONT=[[1, 0], [0.9834, 0.0297], [0.9679, 0.0728], [0.9527, 0.1159], [0.9405, 0.1593], [0.934, 0.2033], [0.9305, 0.2474], [0.9239, 0.2914], [0.9133, 0.3352], [0.902, 0.379], [0.8915, 0.423], [0.8811, 0.4671], [0.8705, 0.5108], [0.8598, 0.5534], [0.8485, 0.5949], [0.837, 0.6366], [0.8266, 0.6798], [0.8164, 0.7235], [0.8013, 0.7647], [0.7755, 0.7991], [0.7389, 0.8243], [0.6958, 0.8427], [0.6503, 0.8576], [0.6038, 0.8713], [0.5571, 0.8845], [0.5099, 0.8969], [0.4621, 0.9087], [0.4141, 0.9196], [0.3658, 0.929], [0.317, 0.9371], [0.268, 0.9455], [0.2188, 0.9548], [0.1697, 0.9645], [0.1223, 0.9764], [0, 1]];

const FIT_NOTES={shape:'Stretches the artwork’s outline to the brim’s outline. Use this for art drawn on the brim template.',

// Which edge holds the two "horns" of a brim outline (filled ends, empty middle)?

  let total=0;for(let i=3;i<d.length;i+=4)if(d[i]>60)total++;const coverage=total/(w*h);
  const band=(side)=>{const along=(side==='top'||side==='bottom')?w:h,depth=Math.max(2,Math.round(((side==='top'||side==='bottom')?h:w)*0.12));

function removeFlatBackground(c){

  const bg=[0,1,2].map(k=>corners.reduce((s,c2)=>s+c2[k],0)/4);
  const dist=(r,g2,b)=>Math.abs(r-bg[0])+Math.abs(g2-bg[1])+Math.abs(b-bg[2]);

// Prepare an uploaded underbrim image so it lines up with the bill.
function processUnderImage(img){
  const sc=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*sc));c.height=Math.max(1,Math.round(img.naturalHeight*sc));
  const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);
  const d=g.getImageData(0,0,c.width,c.height).data;let clear=0;for(let i=3;i<d.length;i+=4)if(d[i]<200)clear++;
  const hasAlpha=clear/(c.width*c.height)>0.02;

  if(work){

      const out=rotCanvas(t,deg);
      const bits=['Matched to the brim outline'];
      if(bgRemoved)bits.push('removed the plain background');
      if(deg)bits.push(deg===180?'flipped it so the front edge sits at the bottom':'turned it so the front edge sits at the bottom');

function brimTemplate(){

  const map=(x,z)=>[pad+(xMaxB-x)*PX,pad+(z-zMin)*PX];g.beginPath();
  for(let i=0;i<=NB;i++){const th=-THB+2*THB*i/NB,p=brimFlat(th,1),m=map(p[0],p[1]);i?g.lineTo(m[0],m[1]):g.moveTo(m[0],m[1]);}

  else if(t.id===`${key}-text`){z.text=t.value;clearTimeout(textTimer);textTimer=setTimeout(()=>{
      if(z.text.trim()){if(key==='under'&&z.source!=='text'){z.fit='free';z.size=10;z.h=-XC;z.v=0;z.rot=0;syncZoneUI(key);}if(key==='inside'&&z.source!=='text'){z.fit='free';z.size=6;z.h=0;z.v=5;z.rot=0;syncZoneUI(key);}z.source='text';}
      else if(z.source==='text')z.source=z.image?'image':null;
      loadFont(z.font).then(()=>refreshArt(key));},140);}
  else if(t.id===`${key}-tcolor`){z.textColor=t.value;if(z.source==='text')refreshArt(key);}
  else if(t.id===`${key}-bcolor`){z.backingColor=t.value;if(z.backing!=='none')refreshArt(key);}
});
panels.addEventListener('change',e=>{
  const t=e.target;const panel=t.closest('.panel');const key=panel&&panel.dataset.panel;if(!ZONES[key])return;const z=ZONES[key];
  if(t.id===`${key}-font`){z.font=t.value;if(z.text.trim()){z.source='text';loadFont(z.font).then(()=>refreshArt(key));}}
});
function loadFont(f){try{return document.fonts.load(FONTS[f].css).catch(()=>{});}catch(_){return Promise.resolve();}}

/* files */
function loadFile(file,key){
  if(!file||!/^image\//.test(file.type)){toast('That file isn’t an image. Use a PNG, JPG, SVG, or WebP.');return;}
  const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{
      const z=ZONES[key];z.imageName=file.name;z.source='image';z.text='';
      if(key==='under'){const r=processUnderImage(img);z.image=r.canvas;z.fit=r.fit;z.note=r.note;z.autoFit=true;}
      else if(key==='inside'){z.image=img;z.fit='fill';z.autoFit=true;}
      else z.image=img;
      refreshArt(key);syncZoneUI(key);
      if(activeTab!==key)selectTab(key);};
    img.onerror=()=>toast('That image couldn’t be read. Try exporting it as PNG.');img.src=rd.result;};
  rd.readAsDataURL(file);
}
$('#fileInput').addEventListener('change',e=>{loadFile(e.target.files[0],fileTarget);e.target.value='';});
let dragDepth=0;
const dropKey=()=>ZONES[activeTab]?activeTab:'front';
stage.addEventListener('dragenter',e=>{e.preventDefault();dragDepth++;$('#dropZoneName').textContent={front:'front',side:'side',under:'underbrim',back:'back',inside:'inside'}[dropKey()];stage.classList.add('dragging');});
stage.addEventListener('dragover',e=>e.preventDefault());
stage.addEventListener('dragleave',()=>{if(--dragDepth<=0){dragDepth=0;stage.classList.remove('dragging');}});
stage.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;stage.classList.remove('dragging');const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)loadFile(f,dropKey());});

/* tabs */
function selectTab(name,moveCam=true){
  activeTab=name;
  $$('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===name)));
  $$('.panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===name));
  if(!moveCam)return;
  stopSpin();
  if(name==='colors')goView('quarter');
  else if(name==='side')goView(ZONES.side.which==='right'?'right':'left');
  else if(name==='inside')goView(ZONES.inside.which==='front'?'insideFront':'inside');
  else goView(ZONES[name].view);
}
$$('.tabs button').forEach(b=>b.addEventListener('click',()=>selectTab(b.dataset.tab)));

/* colors */
const presetsEl=$('#presets');
PRESETS.forEach(p=>{const b=document.createElement('button');b.className='swatch';
  b.innerHTML=`<span class="chips"><i style="background:${p.c.crown}"></i><i style="background:${p.c.brim}"></i><i style="background:${p.c.under}"></i></span>${p.name}`;
  b.addEventListener('click',()=>{Object.assign(colors,p.c,{binding:null,lining:null,tape:null,sweat:null});applyColors();syncColorUI();});presetsEl.appendChild(b);});
function syncColorUI(){$$('[data-color]').forEach(i=>i.value=eff(i.dataset.color));}
let colorRaf=0;
$$('[data-color]').forEach(i=>i.addEventListener('input',()=>{colors[i.dataset.color]=i.value;cancelAnimationFrame(colorRaf);colorRaf=requestAnimationFrame(()=>{applyColors();syncColorUI();});}));
$('#ropeToggle').addEventListener('change',e=>{ropeOn=e.target.checked;rope.visible=ropeOn;dirty=true;});
$('#perfToggle').addEventListener('change',e=>{perforated=e.target.checked;paintCrown();dirty=true;});
function applyColors(){
  paintCrown();paintBrim();
  tapeMat.color.copy(lin(eff('tape')));sweatMat.color.copy(lin(eff('sweat')));
  ropeMat.color.copy(lin(colors.rope));
  underMat.color.copy(lin(colors.under));edgeMat.color.copy(lin(colors.brim));buttonMat.color.copy(lin(colors.button));strapMat.color.copy(lin(colors.strap));pegMat.color.copy(lin(shade(colors.strap,isDark(colors.strap)?0.06:-0.06)));
  dirty=true;
}

/* toast */
let toastTimer=0;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}

/* export */
let downloads=null,hasHost=!!(window.claude&&typeof window.claude.use==='function');
const saveBtn=$('#saveBtn');
if(hasHost){saveBtn.disabled=true;const tb=$('#templateBtn');if(tb)tb.disabled=true;window.claude.use('downloads').then(d=>{downloads=d;if(d){saveBtn.disabled=false;if(tb)tb.disabled=false;}else{saveBtn.hidden=true;if(tb)tb.hidden=true;}}).catch(()=>{saveBtn.hidden=true;if(tb)tb.hidden=true;});}
saveBtn.addEventListener('click',async()=>{
  const transparent=$('#transparentToggle').checked;
  if(!transparent)scene.background=lin(getComputedStyle(document.documentElement).getPropertyValue('--backdrop').trim()||'#E3E4E6');
  applyCamera();renderer.render(scene,camera);
  const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
  scene.background=null;dirty=true;
  if(!blob){toast('The image couldn’t be created. Try again.');return;}
  saveBlob(blob,'cap-mockup.png');
});
async function saveBlob(blob,filename){
  if(downloads){
    try{await downloads.save({filename,data:blob});toast('Saved '+filename);}
    catch(err){const c=err&&err.code;
      if(c==='declined')toast('Save canceled');
      else if(c==='rate_limited')toast('A save prompt is already open');
      else if(c==='too_large')toast('The image is too large to save here');
      else{toast('Saving isn’t available in this view');saveBtn.hidden=true;const tb=$('#templateBtn');if(tb)tb.hidden=true;}}
  }else if(!hasHost){
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Saved '+filename);
  }
}

/* ---------- boot ---------- */
syncColorUI();applyColors();
for(const k of['front','side','back','under','inside'])syncZoneUI(k);
selectTab('front',false);
resize();
cam.yaw=VIEWS.quarter.yaw;cam.pitch=VIEWS.quarter.pitch;cam.dist=fitDist(46);
requestAnimationFrame(loop);
Promise.race([Promise.all(['sans','script','serif'].map(loadFont)),new Promise(r=>setTimeout(r,2500))]).then(()=>{
  makeSamples();for(const k of['front','side','back','under','inside'])refreshArt(k);
});
})();
</script>
</body>
</html>
