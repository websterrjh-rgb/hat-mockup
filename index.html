<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Hat Mockup Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        
        /* Mockup Container Styles */
        .mockup-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #fff;
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .base-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Color Overlay Styles */
        .color-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            mix-blend-mode: multiply;
            pointer-events: none;
            z-index: 2;
            transition: background-color 0.3s ease;
        }

        /* Approximate Clip Paths for Hat Sections */
        /* 1. Front View */
        .clip-front-main { clip-path: polygon(25% 15%, 75% 15%, 88% 62%, 12% 62%); }
        .clip-front-brim { clip-path: polygon(10% 61%, 90% 61%, 98% 95%, 2% 95%); }

        /* 2. Angled View */
        .clip-angled-main { clip-path: polygon(30% 18%, 70% 22%, 72% 64%, 18% 60%); }
        .clip-angled-brim { clip-path: polygon(12% 58%, 55% 65%, 52% 98%, 5% 85%); }
        .clip-angled-back { clip-path: polygon(68% 22%, 92% 35%, 95% 75%, 70% 64%); }

        /* 3. Under Brim View */
        .clip-under-brim { clip-path: polygon(5% 35%, 55% 30%, 65% 95%, 15% 90%); }
        .clip-under-back { clip-path: polygon(55% 15%, 95% 25%, 90% 80%, 60% 40%); }

        /* Draggable Artwork Styles */
        .artwork-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through if not on the item */
        }

        .draggable-item {
            position: absolute;
            top: 40%;
            left: 40%;
            width: 120px;
            pointer-events: auto;
            border: 2px dashed transparent;
            cursor: grab;
            user-select: none;
        }

        .draggable-item:active {
            cursor: grabbing;
        }

        .draggable-item:hover, .draggable-item.active {
            border-color: #3b82f6; /* Tailwind blue-500 */
        }

        .draggable-item img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none; /* Prevent native image drag */
        }

        .resize-handle {
            position: absolute;
            bottom: -6px;
            right: -6px;
            width: 16px;
            height: 16px;
            background-color: #3b82f6;
            border: 2px solid white;
            border-radius: 50%;
            cursor: nwse-resize;
            display: none;
        }

        .draggable-item:hover .resize-handle,
        .draggable-item.active .resize-handle {
            display: block;
        }

        /* Custom Scrollbar for sidebar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden text-gray-800">

    <!-- Sidebar -->
    <aside class="w-full md:w-80 bg-white border-r border-gray-200 flex flex-col h-full z-20 shadow-lg shrink-0 overflow-y-auto">
        <div class="p-6 border-b border-gray-100">
            <h1 class="text-xl font-bold text-gray-900 tracking-tight">Hat Mockup Pro</h1>
            <p class="text-sm text-gray-500 mt-1">Customize colors and upload logos</p>
        </div>

        <div class="p-6 flex-1 space-y-8">
            <!-- Colors Section -->
            <section>
                <h2 class="text-xs font-bold uppercase text-gray-400 mb-4 tracking-wider">Base Colors</h2>
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <label class="text-sm font-medium">Front Body</label>
                        <input type="color" id="color-front" value="#ffffff" class="w-8 h-8 rounded cursor-pointer border-0 p-0">
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="text-sm font-medium">Brim</label>
                        <input type="color" id="color-brim" value="#ffffff" class="w-8 h-8 rounded cursor-pointer border-0 p-0">
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="text-sm font-medium">Back Mesh</label>
                        <input type="color" id="color-back" value="#ffffff" class="w-8 h-8 rounded cursor-pointer border-0 p-0">
                    </div>
                </div>
            </section>

            <hr class="border-gray-100">

            <!-- Artwork Section -->
            <section>
                <h2 class="text-xs font-bold uppercase text-gray-400 mb-4 tracking-wider">Upload Artwork</h2>
                <div class="space-y-5">
                    
                    <!-- Front Logo Input -->
                    <div>
                        <label class="block text-sm font-medium mb-1">Front Logo</label>
                        <p class="text-xs text-gray-500 mb-2">Applies to the front view.</p>
                        <input type="file" id="upload-front" accept="image/*" class="block w-full text-sm text-gray-500
                            file:mr-4 file:py-2 file:px-4
                            file:rounded-md file:border-0
                            file:text-sm file:font-semibold
                            file:bg-blue-50 file:text-blue-700
                            hover:file:bg-blue-100 cursor-pointer border border-gray-200 rounded-md">
                    </div>

                    <!-- Side Logo Input -->
                    <div>
                        <label class="block text-sm font-medium mb-1">Side Logo</label>
                        <p class="text-xs text-gray-500 mb-2">Applies to the angled view.</p>
                        <input type="file" id="upload-side" accept="image/*" class="block w-full text-sm text-gray-500
                            file:mr-4 file:py-2 file:px-4
                            file:rounded-md file:border-0
                            file:text-sm file:font-semibold
                            file:bg-blue-50 file:text-blue-700
                            hover:file:bg-blue-100 cursor-pointer border border-gray-200 rounded-md">
                    </div>

                    <!-- Under Brim Input -->
                    <div>
                        <label class="block text-sm font-medium mb-1">Under Brim Artwork</label>
                        <p class="text-xs text-gray-500 mb-2">Applies to the bottom view.</p>
                        <input type="file" id="upload-under" accept="image/*" class="block w-full text-sm text-gray-500
                            file:mr-4 file:py-2 file:px-4
                            file:rounded-md file:border-0
                            file:text-sm file:font-semibold
                            file:bg-blue-50 file:text-blue-700
                            hover:file:bg-blue-100 cursor-pointer border border-gray-200 rounded-md">
                    </div>

                </div>
            </section>
        </div>
        
        <div class="p-6 bg-gray-50 border-t border-gray-200 text-xs text-gray-500 text-center">
            Drag to reposition. Drag corner to resize.
        </div>
    </aside>

    <!-- Main Previews Area -->
    <main class="flex-1 overflow-y-auto p-6 md:p-8">
        <div class="max-w-6xl mx-auto">
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                
                <!-- View 1: Front View -->
                <div class="flex flex-col gap-3">
                    <h3 class="font-semibold text-gray-700">Front View</h3>
                    <div class="mockup-container">
                        <!-- Base Image -->
                        <img src="Ab4ca9a1ea95c47adbc72140ca068aaa9Y.jpg" class="base-image" alt="Front Hat Base">
                        
                        <!-- Color Overlays -->
                        <div class="color-overlay tint-front clip-front-main" style="background-color: #ffffff;"></div>
                        <div class="color-overlay tint-brim clip-front-brim" style="background-color: #ffffff;"></div>
                        
                        <!-- Draggable Artwork Layer -->
                        <div class="artwork-layer" id="layer-front"></div>
                    </div>
                </div>

                <!-- View 2: Angled View -->
                <div class="flex flex-col gap-3">
                    <h3 class="font-semibold text-gray-700">Angled View</h3>
                    <div class="mockup-container">
                        <!-- Base Image -->
                        <img src="A7814047269eb4b33a1474a40589ce536H.jpg" class="base-image" alt="Angled Hat Base">
                        
                        <!-- Color Overlays -->
                        <div class="color-overlay tint-front clip-angled-main" style="background-color: #ffffff;"></div>
                        <div class="color-overlay tint-brim clip-angled-brim" style="background-color: #ffffff;"></div>
                        <div class="color-overlay tint-back clip-angled-back" style="background-color: #ffffff;"></div>
                        
                        <!-- Draggable Artwork Layer -->
                        <div class="artwork-layer" id="layer-side"></div>
                    </div>
                </div>

                <!-- View 3: Under Brim View -->
                <div class="flex flex-col gap-3">
                    <h3 class="font-semibold text-gray-700">Under Brim View</h3>
                    <div class="mockup-container">
                        <!-- Base Image -->
                        <img src="Aa7133301b768452eb45592ca23528c24U.jpg" class="base-image" alt="Under Brim Hat Base">
                        
                        <!-- Color Overlays -->
                        <div class="color-overlay tint-brim clip-under-brim" style="background-color: #ffffff;"></div>
                        <div class="color-overlay tint-back clip-under-back" style="background-color: #ffffff;"></div>
                        
                        <!-- Draggable Artwork Layer -->
                        <div class="artwork-layer" id="layer-under"></div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- Color Picker Logic ---
            const colorInputs = {
                front: document.getElementById('color-front'),
                brim: document.getElementById('color-brim'),
                back: document.getElementById('color-back')
            };

            const tintTargets = {
                front: document.querySelectorAll('.tint-front'),
                brim: document.querySelectorAll('.tint-brim'),
                back: document.querySelectorAll('.tint-back')
            };

            // Bind color pickers to specific overlay zones
            Object.keys(colorInputs).forEach(key => {
                colorInputs[key].addEventListener('input', (e) => {
                    const color = e.target.value;
                    tintTargets[key].forEach(el => {
                        el.style.backgroundColor = color;
                    });
                });
            });

            // --- File Upload & Draggable Logic ---
            const uploadConfigs = [
                { inputId: 'upload-front', layerId: 'layer-front' },
                { inputId: 'upload-side', layerId: 'layer-side' },
                { inputId: 'upload-under', layerId: 'layer-under' }
            ];

            uploadConfigs.forEach(config => {
                const input = document.getElementById(config.inputId);
                const layer = document.getElementById(config.layerId);

                input.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        // Clear existing artwork in this layer
                        layer.innerHTML = '';

                        // Create draggable container
                        const wrapper = document.createElement('div');
                        wrapper.className = 'draggable-item';
                        
                        // Create image
                        const img = document.createElement('img');
                        img.src = event.target.result;
                        
                        // Create resize handle
                        const handle = document.createElement('div');
                        handle.className = 'resize-handle';

                        wrapper.appendChild(img);
                        wrapper.appendChild(handle);
                        layer.appendChild(wrapper);

                        // Attach drag and resize events
                        makeInteractable(wrapper, handle);
                    };
                    reader.readAsDataURL(file);
                });
            });

            // --- Drag & Resize Implementation ---
            function makeInteractable(el, handle) {
                let isDragging = false;
                let isResizing = false;
                let startX, startY, startW, startLeft, startTop;

                // Mousedown event
                el.addEventListener('mousedown', function(e) {
                    if (e.target === handle) {
                        isResizing = true;
                        startW = el.offsetWidth;
                    } else {
                        isDragging = true;
                        startLeft = el.offsetLeft;
                        startTop = el.offsetTop;
                    }
                    
                    startX = e.clientX;
                    startY = e.clientY;
                    
                    // Visual feedback
                    document.querySelectorAll('.draggable-item').forEach(item => item.classList.remove('active'));
                    el.classList.add('active');
                    
                    e.preventDefault(); // Prevent text selection
                    e.stopPropagation();
                });

                // Window mousemove event
                window.addEventListener('mousemove', function(e) {
                    if (isDragging) {
                        const dx = e.clientX - startX;
                        const dy = e.clientY - startY;
                        
                        el.style.left = `${startLeft + dx}px`;
                        el.style.top = `${startTop + dy}px`;
                    } 
                    else if (isResizing) {
                        const dx = e.clientX - startX;
                        // Enforce a minimum width so it doesn't flip/disappear
                        const newWidth = Math.max(20, startW + dx);
                        el.style.width = `${newWidth}px`;
                        
                        // Height auto-adjusts due to CSS img { width: 100%; height: auto; }
                    }
                });

                // Window mouseup event
                window.addEventListener('mouseup', function() {
                    isDragging = false;
                    isResizing = false;
                });
            }

            // Deselect active item when clicking outside
            document.addEventListener('mousedown', function(e) {
                if (!e.target.closest('.draggable-item') && !e.target.closest('input')) {
                    document.querySelectorAll('.draggable-item').forEach(item => {
                        item.classList.remove('active');
                    });
                }
            });
        });
    </script>
</body>
</html>
